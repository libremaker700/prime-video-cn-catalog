name: Test Gemini Chinese title search

# Manual one-title diagnostic only. No catalogue, Pages or OCI writes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: pip install requests==2.34.2
      - name: Test Vinland Saga with Google Search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PROBE_REPORT: ${{ runner.temp }}/gemini-probe-report.json
        run: python scripts/probe_gemini.py
      - name: Save sanitized diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-title-probe
          path: ${{ runner.temp }}/gemini-probe-report.json
          if-no-files-found: ignore
          retention-days: 7
