name: Update Prime Video CN Catalog

# Check daily; the script enforces the seven-day interval and partial retry schedule.
# Manual runs force collection. Retain failed records and never publish invalid data.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync = force collection; publish = validate and publish the existing catalog'
        type: choice
        options: [sync, publish]
        default: sync
      budget_seconds:
        description: 'Collection budget in seconds (60-1800; blank uses the repository setting, default 1200)'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate identity-bound source matching evidence
        run: python scripts/review_sources.py --check-policy
      - name: Align public App mappings and compatible movie fields
        run: python scripts/import_app_metadata.py
      - name: Sync (skip if <7 days / 604800s since last success; manual run forces)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync')
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          UPDATE_INTERVAL_SECONDS: ${{ vars.UPDATE_INTERVAL_SECONDS || '604800' }}
          DISCOVERY_LIMIT: ${{ vars.DISCOVERY_LIMIT || '20' }}
          SYNC_BUDGET_SECONDS: ${{ inputs.budget_seconds || vars.SYNC_BUDGET_SECONDS || '1200' }}
          TRANSLATE_PROVIDER: ${{ secrets.TRANSLATE_PROVIDER }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_BASE_URL: ${{ secrets.TRANSLATE_BASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/sync.py --force
          else
            python scripts/sync.py --due
          fi
      - name: Check source availability before App delivery
        env:
          SOURCE_PROVIDERS_JSON: ${{ secrets.SOURCE_PROVIDERS_JSON }}
          SOURCE_CHECK_LIMIT: ${{ vars.SOURCE_CHECK_LIMIT || '12' }}
          SOURCE_CHECK_BUDGET_SECONDS: ${{ vars.SOURCE_CHECK_BUDGET_SECONDS || '120' }}
        run: python scripts/check_source_verification.py --limit "$SOURCE_CHECK_LIMIT" --budget-seconds "$SOURCE_CHECK_BUDGET_SECONDS"
      - name: Publish identity-bound source verification metadata
        run: python scripts/publish_source_verification.py
      - name: Validate before publish
        run: python scripts/validate.py
      - name: Retain active and previous releases only
        run: python scripts/prune_publication.py
      - name: Commit only changed files
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add docs
          if [ -f logs/last_run.json ]; then git add logs/last_run.json; fi
          if [ -f data/discovery_queue.json ]; then git add data/discovery_queue.json; fi
          if [ -f data/source-verification.json ]; then git add data/source-verification.json; fi
          git diff --cached --quiet || git commit -m "catalog: auto update $(date -u +%F)"
          git push
      - name: Publish verified catalogue to Oracle Object Storage
        env:
          OCI_MIRROR_ENABLED: ${{ vars.OCI_MIRROR_ENABLED || 'false' }}
          OCI_CATALOG_UPLOAD_URL: ${{ secrets.OCI_CATALOG_UPLOAD_URL }}
          OCI_CATALOG_PUBLIC_URL: ${{ vars.OCI_CATALOG_PUBLIC_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "publish" ]; then
            python scripts/publish_oci.py --force
          else
            python scripts/publish_oci.py
          fi
      - name: Preserve failed-attempt diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-failed-attempt
          path: logs/last_attempt.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Deploy GitHub Pages (docs/)
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
